name: pai-database

services:
  postgres:
    image: postgres:18-alpine
    container_name: pai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in devops/database/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set in devops/database/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in devops/database/.env}
    ports:
      - "${POSTGRES_PORT:?set in devops/database/.env}:5432"
    volumes:
      - pai_postgres18_data:/var/lib/postgresql
    networks:
      - pai-proxy

volumes:
  pai_postgres18_data:
    name: pai_postgres18_data

networks:
  pai-proxy:
    external: true
