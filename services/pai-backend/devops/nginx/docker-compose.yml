name: pai-nginx

services:
  nginx:
    image: nginx:stable-alpine
    container_name: pai-nginx
    ports:
      - "${NGINX_PORT:?set in devops/nginx/.env}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pai-proxy

networks:
  pai-proxy:
    external: true
