repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: sh -c 'cd backend && uv run ruff format --check'
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: sh -c 'cd backend && uv run ruff check'
        language: system
        types: [python]
