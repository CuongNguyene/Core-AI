[project]
name = "pai-platform"
version = "0.1.0"
description = "PAI evidence-based competency and learning platform"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.51",
  "pydantic>=2.13",
  "pydantic-settings>=2.13",
  "sqlalchemy[asyncio]>=2.0.51",
  "asyncpg>=0.30",
  "alembic>=1.18",
  "httpx>=0.28",
  "structlog>=25.4",
  "python-multipart>=0.0.20",
  "minio>=7.2",
  "cryptography>=45.0",
  "openai>=1.99.5,<2",
  "pypdf>=6.0",
  "python-docx>=1.2",
  "arq>=0.26,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pre-commit>=4.2",
  "ruff>=0.12",
  "mypy>=1.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008", "E501", "ASYNC240"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
