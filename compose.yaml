name: core-ai

include:
  - path: ./services/pai-backend/devops/compose/docker-compose.local.yml

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${FRAPPE_DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - frappe_mariadb_data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine

  redis-queue:
    image: redis:7-alpine

  redis-socketio:
    image: redis:7-alpine

  frappe:
    image: frappe/bench:latest
    command: ["bash", "/workspace/source/infra/frappe-init.sh"]
    working_dir: /workspace
    environment:
      FRAPPE_SITE: ${FRAPPE_SITE:-core-ai.localhost}
      FRAPPE_ADMIN_PASSWORD: ${FRAPPE_ADMIN_PASSWORD:?set in .env}
      FRAPPE_DB_ROOT_PASSWORD: ${FRAPPE_DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - .:/workspace/source
      - frappe_bench_data:/workspace/bench
    ports:
      - "${FRAPPE_HTTP_PORT:-8000}:8000"
      - "${FRAPPE_SOCKETIO_PORT:-9000}:9000"
    depends_on:
      mariadb:
        condition: service_started
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
      backend:
        condition: service_started

volumes:
  frappe_mariadb_data:
  frappe_bench_data:
